# Experiment name
experiment: "SAN_v2"

# Random seed
seed: 20200814

# Training parameters
epoches: 200
batch_size: 8
workers: 0
optimizer: Adadelta
lr: 1
lr_decay: cosine
step_ratio: 10
eps: 1e-6
weight_decay: 1e-4
beta: 0.9
image_resize: True
image_width: 1600
image_height: 320
image_channel: 1
dropout: True
dropout_ratio: 0.5
relu: True
gradient: 100
gradient_clip: True
use_label_mask: False

# Training data
train_image_path: 'data/train_image.pkl'
train_label_path: 'data/train_label.pkl'
eval_image_path: 'data/test_image.pkl'
eval_label_path: 'data/test_label.pkl'

word_path: 'resources/word.txt'
# word_path: '/Users/martijnslob/github/SAN/data/chrome-mathwriting-ak/word.txt'

# Encoder selection
encoder:
  net: DenseNet
  input_channels: 1
  out_channels: 684

resnet:
  conv1_stride: 1

densenet:
  ratio: 16        # reduction of image dimensions (keep 16 unless you change the DenseNet architecture)
  growthRate: 24   # was: 24
  nDenseBlocks: 16 # nr of layers per denseblock (was: 16)
  reduction: 0.5   # reduction of channels in transition layers between dense blocks
  bottleneck: True
  use_dropout: True

# RNN cell to use
decoder:
  net: SAN_decoder
  cell: 'GRU'
  input_size: 256
  hidden_size: 256
  # Per-request symbol adjustment offsets (added to log probabilities)
  prior_offsets:
    DISABLE: -100      # Effectively masks the symbol
    STRONG_PENALIZE: -5    # Makes symbol much less likely
    PENALIZE: -3       # Makes symbol less likely
    BOOST: 3          # Makes symbol more likely
    STRONG_BOOST: 5    # Makes symbol much more likely

# Attention parameters
attention:
  attention_dim: 512
  use_position_encoding: True  # Set to True to enable positional encoding (requires retraining)
  # Learnable weights to balance attention terms (initialized values)
  query_weight: 2.0
  coverage_weight: 4.0
  features_weight: 0.5
  position_encoding_weight: 1.0  
  # Learnable weight to balance alpha_sum_parent (parent constructs) vs alpha (latest symbol)
  alpha_sum_parent_weight: 1.0
  # Learnable exponential decay factor for parent attention (0.0=full decay, 1.0=no decay)
  alpha_decay: 0.9

# hybrid tree
hybrid_tree:
  threshold: 0.5

# Training weights save path
optimizer_save: False
checkpoint_dir: 'checkpoints'
finetune: True
checkpoint: "resources/model.pth"
# checkpoint: "../../model/training/checkpoints/chrome-mathwriting-ak/best-decay.pth"
# checkpoint: "../../model/training/checkpoints/chrome-mathwriting-ak/best-new.pth"

# TensorBoard path
log_dir: 'logs'