# Experiment name
experiment: "SAN"

# Random seed
seed: 20200814

# Training parameters
epoches: 200
batch_size: 8
workers: 0
optimizer: Adadelta
lr: 1
lr_decay: cosine
step_ratio: 10
eps: 1e-6
weight_decay: 1e-4
beta: 0.9
image_resize: True
image_width: 1600
image_height: 320
image_channel: 1
dropout: True
dropout_ratio: 0.5
relu: True
gradient: 100
gradient_clip: True
use_label_mask: False
use_amp: True

# Training data
train_image_path: 'data/chrome2013/train/train_image.pkl'
train_label_path: 'data/chrome2013/train/train_label.pkl'
eval_image_path: 'data/chrome2013/test/test_image.pkl'
eval_label_path: 'data/chrome2013/test/test_label.pkl'

word_path: '../data/chrome-mathwriting-ak/word.txt'

# Encoder selection
encoder:
  net: DenseNet
  input_channels: 1
  out_channels: 684

resnet:
  conv1_stride: 1

densenet:
  ratio: 16
  growthRate: 24
  reduction: 0.5
  bottleneck: True
  use_dropout: True

# RNN cell to use
decoder:
  net: SAN_decoder
  cell: 'GRU'
  input_size: 256
  hidden_size: 256
  inverse: False
  eos_penalty: True

# Attention parameters
attention:
  attention_dim: 512
  use_position_encoding: True  # Set to True to enable positional encoding (requires retraining)
  # Learnable weights to balance attention terms (initialized values)
  query_weight: 2.0
  coverage_weight: 4.0
  features_weight: 0.5
  position_encoding_weight: 1.0  
  # Learnable weight to balance alpha_sum_parent (parent constructs) vs alpha (latest symbol)
  alpha_sum_parent_weight: 1.0
  # Learnable exponential decay factor for parent attention (0.0=full decay, 1.0=no decay)
  alpha_decay: 0.5

# hybrid tree
hybrid_tree:
  threshold: 0.5

# EOS penalty weights (addresses train/inference mismatch)
# Higher weights = stronger penalty for EOS mispredictions
eos_early_weight: 5.0    # Penalty for predicting EOS too early (catastrophic - missing expression parts)
eos_missing_weight: 3.0  # Penalty for not predicting EOS when needed (hallucination)

# Training weights save path
optimizer_save: False
checkpoint_dir: 'training/checkpoints'
finetune: True
#checkpoint: "training/checkpoints/best.pth"
checkpoint: "training/checkpoints/chrome-mathwriting-ak/best-new.pth"

# TensorBoard path
log_dir: 'logs'