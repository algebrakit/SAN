# Experiment name
experiment: "SAN"

# Random seed
seed: 20200814

# Training parameters
epoches: 50
batch_size: 3 # needed to support the largest images
eval_batch_size: 5  # Eval can use larger batches (no gradients/accumulation). Default: 2× batch_size
max_batch_size: 100  # used for most images, which are much smaller than the largest
workers: 0  # REDUCED from 4 to eliminate multiprocessing memory overhead
bucket_percentiles: [0, 30, 60, 90, 98, 99.7, 99.9, 100]  # Creates 5 buckets: 70% smallest images → huge diversity, 2% largest → smaller buckets
bucket_trunc_largest: 7
# bucket_size_multiplier: 1000  # nr of data items per bucket is batch_size x bucket_size_multiplier
use_dynamic_batching: True  # Adjust batch_size per bucket: short sequences get larger batches for better GPU utilization
min_samples_per_step: 32 # default: equal to max_batch_size
optimizer: Adadelta
lr: 1
lr_decay: cosine
step_ratio: 10
eps: 1e-6
weight_decay: 1e-4
beta: 0.9
image_resize: True
image_width: 1600
image_height: 320
image_channel: 1
dropout: True
dropout_ratio: 0.5
relu: True
gradient: 100
gradient_clip: True
use_label_mask: False
use_amp: True

# Training data
train_image_path: '../data/mathwriting-chrome2013/train_image.pkl'
train_label_path: '../data/mathwriting-chrome2013/train_label.pkl'
eval_image_path: '../data/mathwriting-chrome2013/test_image.pkl'
eval_label_path: '../data/mathwriting-chrome2013/test_label.pkl'
word_path: '../data/mathwriting-chrome2013/word.txt'

# Encoder selection
encoder:
  net: DenseNet
  input_channels: 1
  out_channels: 684

resnet:
  conv1_stride: 1

densenet:
  ratio: 16
  growthRate: 24
  reduction: 0.5
  bottleneck: True
  use_dropout: True

# RNN cell to use
decoder:
  net: SAN_decoder
  cell: 'GRU'
  input_size: 256
  hidden_size: 256
  inverse: False
  eos_penalty: True
  
# Attention parameters
attention:
  attention_dim: 512
  use_position_encoding: True
  # Learnable weights to balance attention terms (initialized values)
  query_weight: 2.0
  coverage_weight: 4.0
  features_weight: 0.5
  position_encoding_weight: 1.0  

# hybrid tree
hybrid_tree:
  threshold: 0.5

# Training weights save path
optimizer_save: False
checkpoint_dir: 'checkpoints'
finetune: True
checkpoint: "checkpoints/best.pth"

# TensorBoard path
log_dir: 'logs'
